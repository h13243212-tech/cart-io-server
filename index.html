<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Slipstream — ghost racing</title>
<!-- CrazyGames SDK v3. Loaded here, in the head, as the portal requires.
     It is only *initialised* on a crazygames.com host, so localhost and
     previews never talk to it — and if it fails to load the game still
     runs, which is mandatory (it must survive ad blockers). -->
<script id="cg-sdk" async src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<meta name="description" content="A one-thumb drift racer. Chase the ghost of your best lap." />
<style>
  :root {
    --ink: #eef1f6;
    --dim: #8b93a3;
    --hot: #ff5a4d;
    --cool: #4cc7f0;
    --panel: rgba(14, 17, 22, 0.82);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0d11; color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* HUD ------------------------------------------------------------ */
  #hud {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: clamp(10px, 2.2vmin, 22px);
    font-variant-numeric: tabular-nums;
  }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .tag {
    font-size: clamp(10px, 1.6vmin, 13px); letter-spacing: .16em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 2px;
  }
  .big { font-size: clamp(26px, 5.4vmin, 46px); font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .mid { font-size: clamp(15px, 2.6vmin, 21px); font-weight: 600; line-height: 1.1; }
  .split { display: flex; gap: clamp(14px, 3vmin, 34px); }
  .right { text-align: right; }
  #speedo { display: flex; align-items: baseline; gap: 6px; }
  #speedo .unit { font-size: clamp(10px, 1.5vmin, 13px); color: var(--dim); letter-spacing: .12em; }
  #delta { color: var(--cool); font-weight: 700; }
  #delta.slow { color: var(--hot); }

  /* centre banner (countdown, GO, lap flash) ------------------------ */
  #banner {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    font-size: clamp(44px, 13vmin, 130px); font-weight: 800; letter-spacing: -.04em;
    opacity: 0; transition: opacity .18s ease-out; text-shadow: 0 6px 40px rgba(0,0,0,.6);
  }

  /* overlays (menu / results) -------------------------------------- */
  .screen {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(10px, 2vmin, 20px); padding: 6vmin; text-align: center;
    background: radial-gradient(120% 100% at 50% 0%, rgba(20,25,34,.55), rgba(8,10,13,.92) 70%);
    backdrop-filter: blur(3px);
  }
  .screen.on { display: flex; }
  h1 {
    margin: 0; font-size: clamp(40px, 10vmin, 92px); font-weight: 800;
    letter-spacing: -.045em; line-height: .92;
    background: linear-gradient(180deg, #fff, #9fb3c8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 em { font-style: normal; color: var(--hot); -webkit-text-fill-color: var(--hot); }
  .sub { color: var(--dim); font-size: clamp(12px, 2vmin, 16px); margin: -4px 0 6px; letter-spacing: .02em; }
  .tracks { display: flex; gap: clamp(8px, 1.6vmin, 14px); flex-wrap: wrap; justify-content: center; }
  .card {
    pointer-events: auto; cursor: pointer;
    border: 1px solid rgba(255,255,255,.12); background: var(--panel);
    border-radius: 12px; padding: clamp(9px, 1.7vmin, 15px) clamp(13px, 2.4vmin, 22px);
    min-width: clamp(96px, 19vmin, 150px); transition: border-color .15s, transform .12s, background .15s;
    text-align: left;
  }
  .card:hover { border-color: rgba(255,255,255,.3); }
  .card.sel { border-color: var(--hot); background: rgba(255,90,77,.10); transform: translateY(-2px); }
  .card b { display: block; font-size: clamp(13px, 2.1vmin, 16px); font-weight: 650; letter-spacing: -.01em; }
  .card span { font-size: clamp(10px, 1.6vmin, 12px); color: var(--dim); font-variant-numeric: tabular-nums; }
  .cta {
    margin-top: clamp(6px, 1.4vmin, 14px);
    font-size: clamp(12px, 1.9vmin, 15px); letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink); opacity: .92;
  }
  .cta kbd {
    border: 1px solid rgba(255,255,255,.3); border-radius: 5px; padding: 1px 6px;
    font: inherit; font-size: .92em; letter-spacing: .06em;
  }
  .pulse { animation: pulse 1.7s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
  .scores { display: grid; gap: 6px; font-variant-numeric: tabular-nums; }
  .scores div { display: flex; justify-content: space-between; gap: 40px; font-size: clamp(13px,2.2vmin,17px); }
  .scores div span:first-child { color: var(--dim); }
  .newbest { color: var(--hot); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: clamp(11px,1.8vmin,14px); }

  /* touch controls --------------------------------------------------- */
  #touch { position: absolute; inset: 0; display: none; pointer-events: none; }
  #touch.on { display: block; }
  .pad {
    position: absolute; bottom: max(4vmin, env(safe-area-inset-bottom));
    pointer-events: auto; display: flex; gap: 12px;
  }
  .pad.left { left: 4vmin; }
  .pad.right { right: 4vmin; }
  .btn {
    width: clamp(62px, 13vmin, 92px); height: clamp(62px, 13vmin, 92px);
    border-radius: 50%; display: grid; place-items: center;
    background: rgba(28,33,42,.62); border: 1.5px solid rgba(255,255,255,.18);
    color: #fff; font-size: clamp(20px, 3.4vmin, 28px); font-weight: 700;
    backdrop-filter: blur(6px); transition: background .1s, transform .1s;
  }
  .btn.press { background: rgba(255,90,77,.55); transform: scale(.94); }
  .btn.wide { border-radius: 50%; }
  @media (pointer: fine) { #touch { display: none !important; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="row">
      <div>
        <div class="tag">Lap</div>
        <div class="mid" id="lap">1 / 3</div>
      </div>
      <div class="right">
        <div class="tag">Time</div>
        <div class="big" id="time">0.00</div>
      </div>
      <div class="right">
        <div class="tag">Best</div>
        <div class="mid" id="best">—</div>
        <div class="mid" id="delta"></div>
      </div>
    </div>
    <div class="row">
      <div id="speedo"><span class="big" id="speed">0</span><span class="unit">KM/H</span></div>
      <div class="right" id="surface"></div>
    </div>
  </div>

  <div id="banner"></div>

  <div class="screen on" id="menu">
    <h1>SLIP<em>STREAM</em></h1>
    <div class="sub">One thumb. No brakes on the entry. Chase your own ghost.</div>
    <div class="tracks" id="tracks"></div>
    <div class="cta pulse" id="menuCta"><kbd>SPACE</kbd> or tap to race</div>
  </div>

  <div class="screen" id="result">
    <div class="newbest" id="newbest"></div>
    <h1 id="resultTitle" style="font-size:clamp(30px,7vmin,64px)">LAP DONE</h1>
    <div class="scores" id="scores"></div>
    <div class="cta pulse"><kbd>SPACE</kbd> or tap to retry</div>
  </div>

  <div id="touch">
    <div class="pad left">
      <div class="btn" data-k="left">◀</div>
      <div class="btn" data-k="right">▶</div>
    </div>
    <div class="pad right">
      <div class="btn wide" data-k="brake">■</div>
      <div class="btn wide" data-k="drift">✋</div>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
