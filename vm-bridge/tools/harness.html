<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bridge harness</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid; grid-template-columns: 300px 1fr;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0b0d11; color: #e6edf3;
  }
  aside { padding: 18px; border-right: 1px solid #1d222b; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 14px; margin: 0; letter-spacing: .04em; }
  .sub { font-size: 11px; color: #6e7681; margin: -6px 0 0; }
  label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: #8b949e; display: block; margin-bottom: 4px; }
  input {
    width: 100%; padding: 7px 9px; background: #12161d; color: #e6edf3;
    border: 1px solid #262d38; border-radius: 6px;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  input:focus { outline: none; border-color: #58a6ff; }
  button {
    padding: 8px 12px; border-radius: 6px; cursor: pointer; border: 1px solid #262d38;
    background: #171c24; color: #e6edf3; font: 600 12px ui-sans-serif, system-ui, sans-serif;
  }
  button:hover { background: #1f2632; }
  button.primary { background: #1f6f3f; border-color: #2ea043; }
  button.primary:hover { background: #2ea043; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8b949e; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; flex: 0 0 auto; }
  .dot.up { background: #3fb950; } .dot.down { background: #f85149; }
  .note {
    margin-top: auto; font-size: 11px; color: #6e7681; line-height: 1.5;
    border-top: 1px solid #1d222b; padding-top: 12px;
  }
  main { display: flex; flex-direction: column; min-width: 0; pad: 0; }
  #log {
    flex: 1; overflow-y: auto; padding: 16px 18px; margin: 0;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .row { margin: 0; }
  .meta { color: #8b949e; }
  .out { color: #e6edf3; }
  .err { color: #ff9b91; }
  form { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid #1d222b; background: #0e1218; }
  form input { flex: 1; }
  .caret { color: #3fb950; font: 12px ui-monospace, monospace; align-self: center; }
</style>
</head>
<body>
<aside>
  <div>
    <h1>Arena ⇄ VM bridge</h1>
    <p class="sub">Direct agent harness — no extension needed.</p>
  </div>

  <div>
    <label for="base">Agent URL</label>
    <input id="base" value="/agent" spellcheck="false" />
  </div>

  <div>
    <label for="token">Token</label>
    <input id="token" type="password" placeholder="paste the agent's token" />
  </div>

  <div style="display:flex;gap:8px">
    <button class="primary" id="connect">Connect</button>
    <button id="clear">Clear</button>
  </div>

  <div class="status"><span class="dot" id="dot"></span><span id="stat">not connected</span></div>

  <div class="note" id="note"></div>
</aside>

<main>
  <div id="log"></div>
  <form id="form">
    <span class="caret">$</span>
    <input id="cmd" placeholder="uname -a" spellcheck="false" autocomplete="off" />
    <button class="primary" type="submit">Run</button>
  </form>
</main>

<script type="module">
import { splitNdjson, normalizeExec } from "./extension/lib/protocol.js";

const $ = id => document.getElementById(id);
const log = $("log");
const dot = $("dot");
const stat = $("stat");
let base = "/agent";
let token = "";

if (location.protocol === "https:" && new URLSearchParams(location.search).has("remote")) {
  $("note").textContent =
    "This page is served by the sandbox and proxies /agent to a demo agent running next to it — " +
    "it is NOT your VM. To drive your own VM, run `node tools/serve.mjs` on your machine and open " +
    "http://localhost:5175.";
} else {
  $("note").innerHTML =
    "Start the agent inside the VM:<br><code>python3 agent/bridge_agent.py</code><br><br>" +
    "Remote VM? Tunnel instead of opening a port:<br>" +
    "<code>ssh -N -L 8787:127.0.0.1:8787 kali@vm</code>";
}

function row(cls, text) {
  const d = document.createElement("div");
  d.className = "row " + cls;
  d.textContent = text;                     // never innerHTML
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function setStatus(up, text) {
  dot.className = "dot" + (up === null ? "" : up ? " up" : " down");
  stat.textContent = text;
}

async function health() {
  if (!token) return setStatus(false, "paste the token first");
  try {
    const res = await fetch(base + "/health", { headers: { authorization: "Bearer " + token } });
    if (res.status === 401) return setStatus(false, "token rejected");
    if (!res.ok) return setStatus(false, "http " + res.status);
    const h = await res.json();
    setStatus(true, `${h.user}@${h.host} · agent ${h.agent}`);
  } catch {
    setStatus(false, "offline — is the agent running?");
  }
}

async function run(cmd) {
  const plan = normalizeExec({ cmd });
  if (!plan.ok) return row("err", "error: " + plan.error);

  row("meta", "$ " + plan.cmd);
  let res;
  try {
    res = await fetch(base + "/exec", {
      method: "POST",
      headers: { "content-type": "application/json", authorization: "Bearer " + token },
      body: JSON.stringify({ cmd: plan.cmd, timeout_s: plan.timeout_s }),
    });
  } catch {
    return row("err", "offline — is the agent running?");
  }

  if (!res.ok) {
    let msg = "http " + res.status;
    try { msg = (await res.json()).error || msg; } catch {}
    return row("err", "error: " + msg);
  }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const { events, rest } = splitNdjson(buf);
    buf = rest;
    for (const ev of events) {
      if (ev.t === "out") row("out", ev.d);
      else if (ev.t === "err") row("err", ev.d);
      else if (ev.t === "truncated") row("meta", "[truncated]");
      else if (ev.t === "error") row("err", "error: " + ev.message);
      else if (ev.t === "exit") {
        const bits = [];
        if (ev.timedOut) bits.push("timed out");
        else if (ev.killed) bits.push("killed");
        bits.push(ev.code === null ? "no exit code" : "exit " + ev.code);
        if (ev.ms != null) bits.push(ev.ms + "ms");
        row(ev.code === 0 || ev.timedOut ? "meta" : "err", "[" + bits.join(" · ") + "]");
      }
    }
  }
}

$("connect").addEventListener("click", () => {
  base = ($("base").value.trim() || "/agent").replace(/\/+$/, "");
  token = $("token").value.trim();
  health();
});
$("clear").addEventListener("click", () => { log.textContent = ""; });
$("form").addEventListener("submit", e => {
  e.preventDefault();
  const cmd = $("cmd").value.trim();
  if (!cmd) return;
  $("cmd").value = "";
  run(cmd);
});

if (new URLSearchParams(location.search).has("remote")) {
  // the preview sandbox proxies to a local demo agent; fetch its demo token
  try {
    const r = await fetch("/agent-token");
    token = (await r.text()).trim();
    $("token").value = token;
  } catch {}
}
health();
</script>
</body>
</html>
