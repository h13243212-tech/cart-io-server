<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Arena ⇄ VM Bridge</title>
<style>
  :root { color-scheme: dark; }
  body {
    width: 320px; margin: 0; padding: 14px;
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0d1117; color: #e6edf3;
  }
  h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; flex: 0 0 auto; }
  .dot.up { background: #3fb950; } .dot.down { background: #f85149; }
  label { display: block; font-size: 11px; color: #8b949e; margin: 10px 0 4px; letter-spacing: .04em; text-transform: uppercase; }
  input[type=text], input[type=password] {
    width: 100%; box-sizing: border-box; padding: 7px 9px;
    background: #161b22; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 6px;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  input:focus { outline: none; border-color: #58a6ff; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; padding: 8px 10px; border-radius: 6px; cursor: pointer;
    border: 1px solid #30363d; background: #21262d; color: #e6edf3;
    font: 600 12px ui-sans-serif, system-ui, sans-serif;
  }
  button:hover { background: #30363d; }
  button.primary { background: #238636; border-color: #2ea043; }
  button.primary:hover { background: #2ea043; }
  .status { margin-top: 10px; font-size: 12px; color: #8b949e; min-height: 16px; }
  .trust { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px; font-size: 11px; color: #8b949e; }
  .trust input { margin-top: 2px; }
  .hint { margin-top: 12px; padding-top: 10px; border-top: 1px solid #21262d; font-size: 11px; color: #6e7681; }
  code { background: #161b22; padding: 1px 4px; border-radius: 4px; font-size: 11px; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> Arena ⇄ VM Bridge</h1>

  <label for="base">Agent address</label>
  <input id="base" type="text" spellcheck="false" placeholder="http://127.0.0.1:8787" />

  <label for="token">Token</label>
  <input id="token" type="password" spellcheck="false" placeholder="paste from the agent's console" />

  <div class="row">
    <button id="test">Test</button>
    <button id="save" class="primary">Save</button>
  </div>

  <div class="status" id="status">Not tested yet.</div>

  <label class="trust">
    <input type="checkbox" id="trust" />
    <span>Let the page run commands without asking me each time. Off by
      default — any script on the page could then drive your VM.</span>
  </label>

  <div class="hint">
    Remote VM? Don't open a port. Tunnel instead:<br />
    <code>ssh -N -L 8787:127.0.0.1:8787 kali@your-vm</code>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
